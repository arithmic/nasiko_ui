name: nasiko_ui
description: "A new Flutter package project."
version: 0.1.0
homepage: https://github.com/arithmic/nasiko_ui
repository: https://github.com/arithmic/nasiko_ui
issue_tracker: https://github.com/arithmic/nasiko_ui/issues

environment:
  sdk: ^3.9.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  hugeicons: ^1.1.2
  flutter_screenutil: ^5.9.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # No fonts: section on purpose. Package-declared fonts register under
  # "packages/nasiko_ui/<family>", but this package's TextStyles use bare
  # 'Inter' / 'Chivo Mono' family names, which resolve against the CONSUMING
  # app's font declarations. Every consumer must declare both families in its
  # own pubspec (the nasiko web app already does); bundling them here only
  # shipped ~1.9 MB of fonts nothing could reference.
